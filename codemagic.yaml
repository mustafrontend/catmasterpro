workflows:
  ios-release:
    name: Cat Master PRO iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS Xcode App
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -archivePath $HOME/build/App.xcarchive archive DEVELOPMENT_TEAM="D468YQVPP6"
    artifacts:
      - $HOME/build/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
